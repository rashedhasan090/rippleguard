[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rippleguard"
version = "0.1.0"
description = "Defensive trust-surface mapper for Python, Bash, and GitHub Actions — with git deltas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rippleguard contributors" }]
keywords = ["security", "supply-chain", "github-actions", "static-analysis", "defensive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
rippleguard = "rippleguard.cli:main"

[project.urls]
Homepage = "https://github.com/rashedhasan090/rippleguard"

[tool.setuptools.packages.find]
include = ["rippleguard*"]

[tool.setuptools.package-data]
rippleguard = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
