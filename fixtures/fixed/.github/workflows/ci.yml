name: fixture-fixed

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository (not a fork PR head on pull_request_target)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Deploy using env-mapped secret (not interpolated into run:)
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: printf 'token is mapped via env and never echoed\n'
